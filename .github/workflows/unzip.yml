name: Auto Unzip & Flatten

on:
  push:
    paths:
      - '**.zip'

permissions:
  contents: write

jobs:
  unzip:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Unzip and flatten root folder
        run: |
          for file in $(find . -name "*.zip"); do
            echo "Processing $file"

            temp_dir=$(mktemp -d)

            # Extract zip into temp folder
            unzip -o "$file" -d "$temp_dir"

            # Move contents of root folder to repo root
            for item in "$temp_dir"/*; do
              if [ -d "$item" ]; then
                echo "Flattening folder: $item"
                mv "$item"/* . 2>/dev/null || true
              else
                mv "$item" .
              fi
            done

            rm -rf "$temp_dir"
          done

      - name: Remove zip files
        run: |
          find . -name "*.zip" -type f -delete

      - name: Commit extracted files
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"

          git add .
          git commit -m "Auto-unzipped & flattened files" || echo "No changes to commit"
          git push
